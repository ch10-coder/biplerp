<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>InventoryMate ERP</title>
    
    <!-- Modern Typography: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              gray: {
                850: '#1e2638',
                900: '#111827',
                950: '#090d16',
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'Menlo', 'monospace'],
            },
            animation: {
              'fadeIn': 'fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'slideDown': 'slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'slideUp': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'scale(0.98)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              slideDown: {
                '0%': { opacity: '0', transform: 'translateY(-8px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(16px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* --- MODERN SAAS ERP THEME TOKENS --- */
      :root {
        /* COSMIC SLATE (Default Dark) */
        --bg-main: #090d16;
        --bg-sidebar: rgba(13, 19, 33, 0.96);
        --bg-card: rgba(18, 26, 43, 0.75);
        --bg-card-hover: rgba(26, 37, 62, 0.9);
        --border-color: rgba(255, 255, 255, 0.08);
        --border-highlight: rgba(59, 130, 246, 0.6);
        
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --accent-glow: rgba(59, 130, 246, 0.35);
        
        --glass-bg: linear-gradient(135deg, rgba(18, 26, 43, 0.85) 0%, rgba(13, 19, 33, 0.65) 100%);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-shine: rgba(255, 255, 255, 0.05);

        --orb-1: rgba(59, 130, 246, 0.09);
        --orb-2: rgba(139, 92, 246, 0.07);

        color-scheme: dark;
      }

      [data-theme='midnight'] {
        /* MIDNIGHT CYBER (Neon Indigo & Rose) */
        --bg-main: #050713;
        --bg-sidebar: rgba(9, 12, 30, 0.96);
        --bg-card: rgba(17, 21, 50, 0.75);
        --bg-card-hover: rgba(25, 31, 74, 0.9);
        --border-color: rgba(99, 102, 241, 0.22);
        --border-highlight: #a855f7;
        
        --text-primary: #e0e7ff;
        --text-secondary: #818cf8;
        --text-muted: #6366f1;
        
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --accent-glow: rgba(99, 102, 241, 0.45);
        
        --glass-bg: linear-gradient(135deg, rgba(17, 21, 50, 0.85) 0%, rgba(10, 13, 34, 0.65) 100%);
        --glass-border: rgba(99, 102, 241, 0.25);
        --glass-shine: rgba(165, 180, 252, 0.06);

        --orb-1: rgba(99, 102, 241, 0.12);
        --orb-2: rgba(236, 72, 153, 0.09);

        color-scheme: dark;
      }

      [data-theme='forest'] {
        /* FOREST EMERALD (Deep Jade & Mint) */
        --bg-main: #030f0a;
        --bg-sidebar: rgba(4, 23, 16, 0.96);
        --bg-card: rgba(6, 36, 24, 0.75);
        --bg-card-hover: rgba(9, 52, 36, 0.9);
        --border-color: rgba(16, 185, 129, 0.2);
        --border-highlight: #34d399;
        
        --text-primary: #ecfdf5;
        --text-secondary: #6ee7b7;
        --text-muted: #34d399;
        
        --accent: #10b981;
        --accent-hover: #059669;
        --accent-glow: rgba(16, 185, 129, 0.4);
        
        --glass-bg: linear-gradient(135deg, rgba(6, 36, 24, 0.85) 0%, rgba(3, 20, 14, 0.65) 100%);
        --glass-border: rgba(16, 185, 129, 0.2);
        --glass-shine: rgba(167, 243, 208, 0.06);

        --orb-1: rgba(16, 185, 129, 0.12);
        --orb-2: rgba(4, 120, 87, 0.08);

        color-scheme: dark;
      }

      [data-theme='light'] {
        /* PRO LIGHT SAAS */
        --bg-main: #f8fafc;
        --bg-sidebar: #ffffff;
        --bg-card: #ffffff;
        --bg-card-hover: #f1f5f9;
        --border-color: #e2e8f0;
        --border-highlight: #3b82f6;
        
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --text-muted: #94a3b8;
        
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --accent-glow: rgba(37, 99, 235, 0.18);
        
        --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(248, 250, 252, 0.92) 100%);
        --glass-border: #e2e8f0;
        --glass-shine: rgba(255, 255, 255, 0.9);

        --orb-1: rgba(37, 99, 235, 0.04);
        --orb-2: rgba(99, 102, 241, 0.03);

        color-scheme: light;
      }

      /* Global Reset & Texture */
      body {
        background-color: var(--bg-main);
        background-image: 
          radial-gradient(circle at 15% 15%, var(--orb-1) 0%, transparent 45%),
          radial-gradient(circle at 85% 85%, var(--orb-2) 0%, transparent 45%);
        background-attachment: fixed;
        color: var(--text-primary);
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* Glass Panels */
      .glass-effect {
        background: var(--glass-bg);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        border: 1px solid var(--glass-border);
        box-shadow: 
          0 10px 30px -10px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 0 var(--glass-shine);
      }

      [data-theme='light'] .glass-effect {
        box-shadow: 
          0 4px 20px -2px rgba(0, 0, 0, 0.05),
          0 2px 6px -1px rgba(0, 0, 0, 0.02),
          inset 0 1px 0 0 #ffffff;
      }

      /* Inputs - Clean Base with Focus Ring without breaking custom widths */
      input, select, textarea {
        background-color: var(--bg-card);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        border-radius: 0.5rem;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      }

      input:focus, select:focus, textarea:focus {
        border-color: var(--accent);
        outline: none;
        box-shadow: 0 0 0 2px var(--accent-glow);
        background-color: var(--bg-card-hover);
      }

      [data-theme='light'] input::placeholder,
      [data-theme='light'] select::placeholder,
      [data-theme='light'] textarea::placeholder {
        color: #94a3b8;
      }

      /* Date Picker Indicator */
      input[type="date"]::-webkit-calendar-picker-indicator {
        cursor: pointer;
        opacity: 0.6;
        filter: invert(1);
      }
      [data-theme='light'] input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(0);
        opacity: 0.5;
      }

      /* Sleek Scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }

      .text-glow {
        text-shadow: 0 0 20px var(--accent-glow);
      }

      /* Safe padding for modern mobile devices (notch & home bar) */
      .safe-bottom {
        padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
      }

      /* App Initializer Loader */
      #app-loader {
        position: fixed;
        inset: 0;
        background: var(--bg-main);
        background-image: radial-gradient(circle at center, var(--accent-glow) 0%, transparent 70%);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--text-primary);
        transition: opacity 0.35s ease-out;
      }
      .loader-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid var(--border-color);
        border-top: 3px solid var(--accent);
        border-radius: 50%;
        animation: spin 0.9s cubic-bezier(0.55, 0.055, 0.675, 0.19) infinite;
        box-shadow: 0 0 24px var(--accent-glow);
        margin-bottom: 1.25rem;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="antialiased overflow-hidden h-full text-sm selection:bg-[var(--accent)] selection:text-white">
    <div id="app-loader">
      <div class="loader-spinner"></div>
      <div style="font-size: 1.15rem; font-weight: 700; letter-spacing: 0.04em;">InventoryMate ERP</div>
      <div style="color: var(--text-secondary); font-size: 0.72rem; margin-top: 0.4rem; font-family: 'JetBrains Mono', monospace; opacity: 0.85;">INITIALIZING WORKSPACE...</div>
    </div>
    <div id="root" class="h-full"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      const observer = new MutationObserver((mutations) => {
        if (document.getElementById('root')?.hasChildNodes()) {
          const loader = document.getElementById('app-loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 350);
          }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>
  </body>
</html>
